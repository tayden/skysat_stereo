[workspace]
authors = ["Taylor Denouden <taylor.denouden@hakai.org>"]
channels = ["conda-forge", "usgs-astrogeology", "nasa-ames-stereo-pipeline"]
name = "skysat_stereo"
platforms = ["linux-64"]
version = "0.1.0"
# Ames Stereo Pipeline (stereo-pipeline) ships custom "asp"-flavored builds of
# some shared dependencies (e.g. ale, isis) on its channel that are shadowed
# under strict channel priority. ASP's install docs recommend a flexible
# channel priority; pixi's equivalent is disabling channel priority.
channel-priority = "disabled"

[activation.env]
# The conda stereo-pipeline package bundles ISIS, whose binaries refuse to
# start unless ISISROOT points at the prefix containing IsisPreferences. The
# ISIS conda activation script that would normally set this is not installed,
# so set it here. $CONDA_PREFIX resolves to this pixi environment, so this
# stays portable (unlike a hard-coded Stereo Pipeline install path).
ISISROOT = "$CONDA_PREFIX"

[tasks]

[dependencies]
stereo-pipeline = { version = ">=3.7.0,<4", channel = "nasa-ames-stereo-pipeline" }
# Pins relaxed from their original upper bounds so the environment can be
# solved alongside the conda Ames Stereo Pipeline (stereo-pipeline 3.7.0),
# which requires Python >=3.13, gdal 3.12 and geos 3.14.
scipy = ">=1.17.1,<2"
numpy = ">=1.26.4"
pandas = ">=2.3.3,<3"
matplotlib = ">=3.8"
gdal = ">=3.7.0,<4"
rasterio = ">=1.3.8,<2"
geopandas = ">=0.14.4"
shapely = ">=2.0.1,<3"
contextily = ">=1.7.0,<2"
matplotlib-scalebar = ">=0.8,<1"
descartes = ">=1.1.0,<2"
psutil = ">=7.2.2,<8"
pyquaternion = ">=0.9.9,<0.10"

[pypi-dependencies]
pygeotools = { git = "https://github.com/dshean/pygeotools.git" }
demcoreg = { git = "https://github.com/dshean/demcoreg.git" }
rpcm = { git = "https://github.com/cmla/rpcm.git" }
p-tqdm = ">=1.4.2, <2"
skysat-stereo = { path = ".", editable = true }
